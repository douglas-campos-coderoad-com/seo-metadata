
services:
  postgres:
    image: postgres:16-alpine
    container_name: incollect_postgres
    environment:
      POSTGRES_USER: incollect
      POSTGRES_PASSWORD: incollect
      POSTGRES_DB: incollect_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incollect"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incollect_api
    environment:
      DATABASE_URL: postgresql+asyncpg://incollect:incollect@postgres:5432/incollect_dev
      DEBUG: "True"
      BACKEND_PORT: 8000
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MODEL_FALLBACK: ${LLM_MODEL_FALLBACK:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_MODEL_FALLBACK: ${GEMINI_MODEL_FALLBACK:-gemini-3.6-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      ANTHROPIC_MODEL_FALLBACK: ${ANTHROPIC_MODEL_FALLBACK:-claude-haiku-4-5-20251001}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      REPORT_RENDER_CONCURRENCY: ${REPORT_RENDER_CONCURRENCY:-2}
      REPORT_MAX_CODE_CHARS: ${REPORT_MAX_CODE_CHARS:-20000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      # Mounted so new revision files apply on restart instead of needing an image rebuild.
      - ./backend/migrations:/app/migrations
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # The Dockerfile is multi-stage: `dev` is the hot-reload server used here,
      # `runner` is the compiled image CI pushes to Artifact Registry.
      target: dev
    container_name: incollect_web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/tests:/app/tests
      - /app/node_modules
      - /app/.next
    command: npm run dev
    depends_on:
      api:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:latest
    container_name: incollect_mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    environment:
      MH_STORAGE: memory

volumes:
  postgres_data:
