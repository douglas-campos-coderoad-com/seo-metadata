name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets deploy.yml gate the rollout on exactly these checks.
  workflow_call:
    inputs:
      components:
        description: 'Which side to test: both | backend | frontend'
        type: string
        default: both

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    # On pull_request/push `inputs` is empty, so both jobs run as usual. A
    # component-scoped deploy gates on only the side it is shipping.
    if: ${{ (inputs.components || 'both') != 'frontend' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pip show playwright | awk '/^Version:/ {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The PDF export renders through Chromium, so the browser has to be
      # present for tests/integration/test_report_pdf.py to run at all.
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        # The suite uses in-memory SQLite (tests/conftest.py), so no database
        # service is needed here.
        run: pytest --cov=src tests/

  frontend:
    name: Frontend (lint, types, tests, build)
    if: ${{ (inputs.components || 'both') != 'backend' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run type-check

      - name: Run unit + integration tests
        run: npx vitest run

      - name: Build
        run: npm run build
